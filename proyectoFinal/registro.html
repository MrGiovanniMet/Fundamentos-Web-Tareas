<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>


    <link rel="stylesheet" href="./styles3.css">
    <style>
        body {
            background-image: url("./imagenes/puppy-tips-experts.jpg");
        }
    </style>


</head>

<body>

    <div class="form-container">
        <h2>Crear Cuenta</h2>

        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre">
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <div class="form-group">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" placeholder="••••••••">
        </div>

        <button id="btn-registro">Registrarse</button>
        <p id="msgError" style="display: none;">  Porfavor complete todos los campos</p>
        <p class="link">¿Ya tienes cuenta? <a class="link" href="./login.html">Inicia sesión aquí</a></p>
         <p class="link"> <a class="link" href="./index.html">Inicio</a></p>
       

    </div>
    <script src="./usuarios.js"></script>
    <script src="./registro.js"></script>

</body>

</html>
