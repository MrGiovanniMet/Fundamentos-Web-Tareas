<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body{
            background-color: beige;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            width: 100%;
            height: 220px;
        }

        .element {
            width: 250px;
            height: 220px;
            text-align: center;
        }
        .imagen{
            width: 100%;
            height: 200px;

        }
    </style>
</head>

<body>
    <button onclick="cargar()"> Agregar elemento</button>
    <input id="inp2" type="number" min="1" max="826" placeholder="Escoge un personaje del 1 al 826 ">
    <br><br>
    <div class="container">
        
    </div>
    <script>
        const input = document.getElementById("inp1");
        const container = document.querySelector(".container");

        

        async function cargar(){
            const inpt2 = document.getElementById("inp2").value;
            const result = await fetch(`https://rickandmortyapi.com/api/character/${inpt2}`).then(response => response.json());
    
            if(inpt2 >=1 && inpt2 <=826)
                crearElemento(result);
            
            

        }

        function crearElemento(personaje) {
        
            
            const element = document.createElement("div");
            element.classList.add("element");
            element.textContent = personaje.name;
            container.appendChild(element);

            const img = document.createElement("img");
            img.classList.add("imagen");
            img.src= personaje.image;
            element.appendChild(img);
        
        }

        
    </script>
</body>

</html>
