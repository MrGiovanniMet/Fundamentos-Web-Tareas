<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .contenedor {
            display: flex;
            flex-direction: row;
            /*justify-content: space-around; /* centra elementos de mi contenedor¨*/
            /*justify-content: space-between;  espacio entre elementos */
            /*justify-content: space-around; espacio alrededor de los elementos */
            justify-content: start;/* espacio igual entre elementos */
            align-items: start;

            /* justify and aligs en center ayudan a que se centren los 
            elementos dentro del contenedor */
            flex-wrap: nowrap; /* hace que los elementos se acomoden 
            en varias filas o columnas dependiendo del espacio disponible */
            gap: 5px;

        }

        .elemento {
            width: 200px;
            height: 200px;
            background-color: blue;
            border-top: 4px solid black;
            text-align: center;
            font-size: larger;
            color : white;
            border: 5px solid black;

         

        }
    </style>
</head>

<body>
    <div class="contenedor">
        <div class="elemento">1</div>
        <div class="elemento">2</div>
        <div class="elemento" style="flex-grow: 1;">3</div>
        <div class="elemento" style="flex-grow: 2;">4</div>
        <div class="elemento">5</div>
       
    </div>
</body>

</html>
